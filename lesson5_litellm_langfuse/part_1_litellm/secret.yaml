# Ключи самого LiteLLM (учебные значения; в проде — длинные случайные строки)
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secret
type: Opaque
stringData:
  # master key — ключ администратора: им создают виртуальные ключи и модели, им же входят в UI (логин admin)
  LITELLM_MASTER_KEY: sk-master-1234
  # salt key — им LiteLLM шифрует в базе ключи провайдеров (тех моделей, что добавят через UI/API).
  # Задаётся ОДИН раз: если поменять — сохранённые в базе ключи больше не расшифруются
  LITELLM_SALT_KEY: sk-salt-1234
# Ключ OpenRouter — в отдельном Secret openrouter (make secret)
