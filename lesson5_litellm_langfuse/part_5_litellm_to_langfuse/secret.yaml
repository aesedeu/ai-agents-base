# Куда и с какими ключами LiteLLM пишет трейсы. Ключи проекта — те, что создал Langfuse при
# первом старте (LANGFUSE_INIT_PROJECT_* в part_4_langfuse/values.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: litellm-langfuse
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: pk-lf-bank-agents
  LANGFUSE_SECRET_KEY: sk-lf-bank-agents
  # Langfuse — в другом namespace, поэтому полное имя: <service>.<namespace>.svc.cluster.local
  LANGFUSE_HOST: http://langfuse-web.langfuse.svc.cluster.local:3000
